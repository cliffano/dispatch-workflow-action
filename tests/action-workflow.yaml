name: Test Local Action Outside Standard GitHub Workflows Directory
on: [push]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up fake gh CLI
        shell: bash
        run: |
          # Fake gh CLI which mimics the output of the gh commands used by the action,
          # so the tests are deterministic and don't call GitHub API:
          # - someid/somerepo4 dispatch doesn't print run URL, like older gh versions
          # - someid/somerepo5 run concludes with failure
          # - someid/somerepo7 dispatch fails with HTTP 404
          # - other repos dispatch and conclude with success
          mkdir -p "$RUNNER_TEMP/fake-gh" "$RUNNER_TEMP/fake-gh-state"
          cat > "$RUNNER_TEMP/fake-gh/gh" <<'EOF'
          #!/usr/bin/env bash
          set -o errexit
          set -o nounset
          state_dir="$RUNNER_TEMP/fake-gh-state"
          repo=""
          args=("$@")
          for i in "${!args[@]}"; do
            if [ "${args[$i]}" = "--repo" ]; then
              repo="${args[$((i + 1))]}"
            fi
          done
          repo_state="$state_dir/${repo//\//_}"
          case "$1 $2" in
            "workflow run")
              echo "$*" >> "$repo_state.args"
              cat >> "$repo_state.stdin"
              if [ "$repo" = "someid/somerepo7" ]; then
                echo "HTTP 404: Not Found" >&2
                exit 1
              elif [ "$repo" = "someid/somerepo4" ]; then
                echo "Created workflow_dispatch event for $3 at main"
              else
                echo "https://github.com/$repo/actions/runs/1001"
              fi
              ;;
            "run view")
              # First status check returns in progress, subsequent checks return completed
              if [ ! -f "$repo_state.viewed" ]; then
                touch "$repo_state.viewed"
                echo '{"status": "in_progress", "conclusion": ""}'
              elif [ "$repo" = "someid/somerepo5" ]; then
                echo '{"status": "completed", "conclusion": "failure"}'
              else
                echo '{"status": "completed", "conclusion": "success"}'
              fi
              ;;
            *)
              echo "Unexpected gh command: $*" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/fake-gh/gh"
          echo "$RUNNER_TEMP/fake-gh" >> "$GITHUB_PATH"
      - name: Dispatch workflow on multiple repos and wait for completion
        id: multiple
        uses: ./
        with:
          workflow: 'release-minor-workflow.yaml'
          repos: 'someid/somerepo1, someid/somerepo2'
          github_token: 'test-github-token'
          poll_interval: '1'
      - name: Dispatch workflow with ref and inputs without waiting
        id: nowait
        uses: ./
        with:
          workflow: 'release-workflow.yaml'
          repos: 'someid/somerepo3'
          github_token: 'test-github-token'
          ref: 'some-branch'
          inputs: '{"release_type": "minor"}'
          wait: 'false'
      - name: Dispatch workflow when gh doesn't print run URL
        id: legacy
        continue-on-error: true
        uses: ./
        with:
          workflow: 'ci-workflow.yaml'
          repos: 'someid/somerepo4'
          github_token: 'test-github-token'
          poll_interval: '1'
      - name: Dispatch workflow with a failing run
        id: failing
        continue-on-error: true
        uses: ./
        with:
          workflow: 'ci-workflow.yaml'
          repos: 'someid/somerepo5,someid/somerepo6'
          github_token: 'test-github-token'
          poll_interval: '1'
      - name: Dispatch workflow on a missing repo
        id: missing
        continue-on-error: true
        uses: ./
        with:
          workflow: 'ci-workflow.yaml'
          repos: 'someid/somerepo7'
          github_token: 'test-github-token'
          poll_interval: '1'
      - name: Verify dispatch outputs
        shell: bash
        env:
          MULTIPLE_RUN_URLS: ${{ steps.multiple.outputs.run_urls }}
          MULTIPLE_CONCLUSIONS: ${{ steps.multiple.outputs.conclusions }}
          NOWAIT_RUN_URLS: ${{ steps.nowait.outputs.run_urls }}
          NOWAIT_CONCLUSIONS: ${{ steps.nowait.outputs.conclusions }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          LEGACY_RUN_URLS: ${{ steps.legacy.outputs.run_urls }}
          LEGACY_CONCLUSIONS: ${{ steps.legacy.outputs.conclusions }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_CONCLUSIONS: ${{ steps.failing.outputs.conclusions }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_RUN_URLS: ${{ steps.missing.outputs.run_urls }}
          MISSING_CONCLUSIONS: ${{ steps.missing.outputs.conclusions }}
        run: |
          set -o errexit
          state_dir="$RUNNER_TEMP/fake-gh-state"

          test "$(jq -r '."someid/somerepo1"' <<< "$MULTIPLE_RUN_URLS")" = 'https://github.com/someid/somerepo1/actions/runs/1001'
          test "$(jq -r '."someid/somerepo2"' <<< "$MULTIPLE_RUN_URLS")" = 'https://github.com/someid/somerepo2/actions/runs/1001'
          test "$(jq -r '."someid/somerepo1"' <<< "$MULTIPLE_CONCLUSIONS")" = 'success'
          test "$(jq -r '."someid/somerepo2"' <<< "$MULTIPLE_CONCLUSIONS")" = 'success'

          test "$(jq -r '."someid/somerepo3"' <<< "$NOWAIT_RUN_URLS")" = 'https://github.com/someid/somerepo3/actions/runs/1001'
          test "$(jq -r '."someid/somerepo3"' <<< "$NOWAIT_CONCLUSIONS")" = ''
          test "$(cat "$state_dir/someid_somerepo3.args")" = 'workflow run release-workflow.yaml --repo someid/somerepo3 --ref some-branch --json'
          test "$(jq -r '.release_type' "$state_dir/someid_somerepo3.stdin")" = 'minor'
          test ! -f "$state_dir/someid_somerepo3.viewed"

          test "$LEGACY_OUTCOME" = 'failure'
          test "$(jq -r '."someid/somerepo4"' <<< "$LEGACY_RUN_URLS")" = ''
          test "$(jq -r '."someid/somerepo4"' <<< "$LEGACY_CONCLUSIONS")" = 'error'

          test "$FAILING_OUTCOME" = 'failure'
          test "$(jq -r '."someid/somerepo5"' <<< "$FAILING_CONCLUSIONS")" = 'failure'
          test "$(jq -r '."someid/somerepo6"' <<< "$FAILING_CONCLUSIONS")" = 'success'

          test "$MISSING_OUTCOME" = 'failure'
          test "$(jq -r '."someid/somerepo7"' <<< "$MISSING_RUN_URLS")" = ''
          test "$(jq -r '."someid/somerepo7"' <<< "$MISSING_CONCLUSIONS")" = 'error'
